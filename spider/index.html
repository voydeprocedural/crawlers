<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crawler</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Options via URL: ?color=ff3344&bg=0b0b0f&size=1&speed=1
const params = new URLSearchParams(location.search);
const COLOR = '#' + (params.get('color') || 'ff3344').replace('#', '');
const BG = params.get('bg');
const SIZE = parseFloat(params.get('size') || '1');
const SPEED = parseFloat(params.get('speed') || '1');
if (BG) document.body.style.background = '#' + BG.replace('#', '');

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, S = 1, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  S = Math.max(0.45, Math.min(1.4, Math.min(W, H) / 420)) * SIZE;
}
window.addEventListener('resize', resize);
resize();

const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

// Spider state
const sp = { x: W / 2, y: H / 2, a: Math.random() * Math.PI * 2, v: 0 };
let target = { x: W / 2, y: H / 2 };
let mouse = null, idleUntil = 0;

// Leg layout: angle from heading (deg), reach, segment lengths
const LEG_DEF = [
  { ang: 38, reach: 66, a: 40, b: 46 },
  { ang: 78, reach: 58, a: 36, b: 40 },
  { ang: 112, reach: 58, a: 36, b: 40 },
  { ang: 148, reach: 70, a: 42, b: 48 },
];
const legs = [];
for (const side of [-1, 1]) {
  LEG_DEF.forEach((d, i) => {
    legs.push({ side, i, ...d, group: (i + (side > 0 ? 1 : 0)) % 2,
                fx: 0, fy: 0, sx: 0, sy: 0, tx: 0, ty: 0, t: 1 });
  });
}

function restFoot(leg, lead) {
  const a = sp.a + leg.side * leg.ang * Math.PI / 180;
  return [sp.x + Math.cos(a) * leg.reach * S + Math.cos(sp.a) * lead,
          sp.y + Math.sin(a) * leg.reach * S + Math.sin(sp.a) * lead];
}
function hip(leg) {
  const a = sp.a + leg.side * (leg.ang * 0.6 + 20) * Math.PI / 180;
  return [sp.x + Math.cos(a) * 9 * S, sp.y + Math.sin(a) * 9 * S];
}
legs.forEach(l => { [l.fx, l.fy] = restFoot(l, 0); });

function pickTarget() {
  const m = 70 * S;
  target = { x: m + Math.random() * Math.max(1, W - 2 * m),
             y: m + Math.random() * Math.max(1, H - 2 * m) };
}
pickTarget();

canvas.addEventListener('pointermove', e => {
  const r = canvas.getBoundingClientRect();
  mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
});
canvas.addEventListener('pointerleave', () => { mouse = null; pickTarget(); });
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect();
  pings.push({ x: e.clientX - r.left, y: e.clientY - r.top, t: 0 });
});
const pings = [];

let placed = false;
function update(dt, now) {
  if (!placed) {
    if (!W || !H) return;
    sp.x = W / 2; sp.y = H / 2; placed = true;
    legs.forEach(l => { [l.fx, l.fy] = restFoot(l, 0); });
    pickTarget();
  }
  const goal = mouse || target;
  const d = dist(sp.x, sp.y, goal.x, goal.y);
  const stopR = mouse ? 55 * S : 20 * S;
  let want = 0;
  if (now > idleUntil && d > stopR) {
    const turn = angDiff(sp.a, Math.atan2(goal.y - sp.y, goal.x - sp.x));
    sp.a += Math.max(-1, Math.min(1, turn)) * dt * 3.2;
    want = (mouse ? 150 : 85) * S * SPEED * Math.max(0.25, Math.cos(turn) * 0.5 + 0.5);
  } else if (!mouse && d <= stopR) {
    idleUntil = now + 400 + Math.random() * 1600;
    pickTarget();
  }
  sp.v = lerp(sp.v, want, Math.min(1, dt * 5));
  sp.x += Math.cos(sp.a) * sp.v * dt;
  sp.y += Math.sin(sp.a) * sp.v * dt;

  // Legs: alternating tetrapod gait
  const lead = sp.v * 0.18;
  const stepDur = Math.max(0.07, 0.16 - sp.v / (2200 * S));
  const stepping = [0, 0];
  legs.forEach(l => { if (l.t < 1) stepping[l.group]++; });
  for (const l of legs) {
    if (l.t < 1) {
      l.t = Math.min(1, l.t + dt / stepDur);
      const e = l.t * l.t * (3 - 2 * l.t);
      l.fx = lerp(l.sx, l.tx, e); l.fy = lerp(l.sy, l.ty, e);
      continue;
    }
    const [rx, ry] = restFoot(l, lead);
    const off = dist(l.fx, l.fy, rx, ry);
    if (off > 24 * S && stepping[1 - l.group] === 0) {
      l.sx = l.fx; l.sy = l.fy; l.tx = rx; l.ty = ry; l.t = 0;
      stepping[l.group]++;
    }
  }
}

function legPoints(l) {
  const [hx, hy] = hip(l);
  const A = l.a * S, B = l.b * S;
  let dx = l.fx - hx, dy = l.fy - hy;
  let d = Math.hypot(dx, dy);
  const maxD = (A + B) * 0.995;
  if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
  const base = Math.atan2(dy, dx);
  const k = Math.acos(Math.max(-1, Math.min(1, (A * A + d * d - B * B) / (2 * A * d || 1))));
  const ka = base - l.side * k;
  const lift = l.t < 1 ? Math.sin(l.t * Math.PI) * 10 * S : 0;
  return [hx, hy, hx + Math.cos(ka) * A, hy + Math.sin(ka) * A - lift * 0.6, hx + dx, hy + dy - lift];
}

function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = COLOR; ctx.fillStyle = COLOR;
  ctx.shadowColor = COLOR; ctx.shadowBlur = 10 * S;

  // Scanner squares
  const t = now / 1000;
  ctx.globalAlpha = 0.55; ctx.lineWidth = 1.2;
  for (let i = 0; i < 3; i++) {
    const r = (34 + i * 16) * S, a = t * (0.6 + i * 0.35) * (i % 2 ? -1 : 1);
    ctx.save(); ctx.translate(sp.x, sp.y); ctx.rotate(a);
    ctx.strokeRect(-r, -r, r * 2, r * 2); ctx.restore();
  }
  // Line to the cursor
  if (mouse) {
    ctx.globalAlpha = 0.5; ctx.setLineDash([4 * S, 6 * S]);
    ctx.beginPath(); ctx.moveTo(sp.x, sp.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeRect(mouse.x - 9 * S, mouse.y - 9 * S, 18 * S, 18 * S);
  }
  // Click pings
  for (let i = pings.length - 1; i >= 0; i--) {
    const p = pings[i]; p.t += 0.016;
    if (p.t > 1) { pings.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - p.t; ctx.lineWidth = 1.5;
    const r = 6 * S + p.t * 40 * S;
    ctx.strokeRect(p.x - r, p.y - r, r * 2, r * 2);
  }

  // Legs
  ctx.globalAlpha = 1;
  for (const l of legs) {
    const [hx, hy, kx, ky, fx, fy] = legPoints(l);
    ctx.lineWidth = 2.6 * S;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.stroke();
    ctx.lineWidth = 1.6 * S;
    ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.beginPath(); ctx.arc(kx, ky, 1.8 * S, 0, Math.PI * 2); ctx.fill();
  }

  // Body
  ctx.save(); ctx.translate(sp.x, sp.y); ctx.rotate(sp.a);
  const bob = Math.sin(t * 14) * (sp.v > 5 ? 0.8 : 0) * S;
  ctx.lineWidth = 1.8 * S;
  // abdomen
  ctx.beginPath(); ctx.ellipse(-24 * S, bob, 20 * S, 15 * S, 0, 0, Math.PI * 2);
  ctx.globalAlpha = 0.18; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
  ctx.lineWidth = 1 * S; ctx.globalAlpha = 0.7;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.ellipse(-24 * S, bob, Math.abs(i) * 4.5 * S + 1, 15 * S, 0, -Math.PI / 2, Math.PI / 2, i < 0);
    ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineWidth = 1.8 * S;
  // cephalothorax
  ctx.beginPath(); ctx.ellipse(2 * S, 0, 12 * S, 10 * S, 0, 0, Math.PI * 2);
  ctx.globalAlpha = 0.25; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
  // fangs
  ctx.lineWidth = 1.6 * S;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(12 * S, s * 3.5 * S); ctx.quadraticCurveTo(19 * S, s * 5 * S, 18 * S, s * 1 * S); ctx.stroke();
  }
  // eyes
  ctx.shadowBlur = 14 * S; ctx.fillStyle = '#fff';
  for (const [ex, ey] of [[9, -3.5], [9, 3.5], [6.5, -6], [6.5, 6]]) {
    ctx.beginPath(); ctx.arc(ex * S, ey * S, 1.4 * S, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt, now);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
